[package]
name = "ui"
description = "Quantum Explainer interface: Leptos (client-side) compiled to WebAssembly, rendered inside WebView2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qcore.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8.23", features = ["csr"] }
wasm-bindgen = "=0.2.130" # must equal the wasm-bindgen CLI version in .tools
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "EventTarget", "HtmlElement", "KeyboardEvent", "MouseEvent", "MediaQueryList", "DomRect", "NodeList", "PointerEvent", "CssStyleDeclaration"] }
console_error_panic_hook = "0.1.7"
