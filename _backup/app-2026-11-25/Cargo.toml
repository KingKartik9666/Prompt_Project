[workspace]
resolver = "3"
members = ["crates/qcore", "crates/ui", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
qcore = { path = "crates/qcore" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The UI is shipped as WebAssembly: optimise it for size.
[profile.release.package.ui]
opt-level = "z"
