[package]
name = "desktop"
description = "Quantum Explainer: native window (tao + wry/WebView2), multi-provider LLM pipeline and asset server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "QuantumExplainer"
path = "src/main.rs"

[dependencies]
qcore.workspace = true
serde.workspace = true
serde_json.workspace = true
wry = "0.57.3"
# 0.38 is newer but its Linux gtk dependency clashes with wry 0.57's; 0.37 is the newest tao wry builds with.
tao = "0.37.3"
window-vibrancy = "0.8.1"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default", "json"] }
rust-embed = "8.14.0"
keyring = "4.2.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation"] }
